name: Playwright tests

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      HEADED: "false"
      BASE_URL: ${{ secrets.APP_URL }}
      ADMIN_ID: ${{ secrets.VALID_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      GUEST_ID: ${{ secrets.GUEST_ID }}
      GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run pytest
        run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
